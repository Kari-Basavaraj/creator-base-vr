<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' fill='%23252b21'/%3E%3Ctext x='8' y='30' fill='white' font-size='30'%3E↗%3C/text%3E%3C/svg%3E"><title>Creator Base — Exported GLB check</title><script type="importmap">{"imports":{"three":"./vendor/three.module.js"}}</script><style>body{margin:0;background:#232823;color:#f0eee5;font:12px system-ui,sans-serif;overflow:hidden}canvas{display:block}header{position:absolute;top:15px;left:15px;right:15px;display:flex;gap:12px;align-items:center;flex-wrap:wrap;padding:12px 16px;background:#1b211bdd;border:1px solid #ffffff30;border-radius:4px}a{color:inherit}select,button{background:#353e32;color:#fff;border:1px solid #ffffff40;padding:7px;font:inherit}#status{position:absolute;bottom:15px;left:15px;background:#1b211bdd;padding:10px 14px;font-size:11px}#loading{position:absolute;inset:0;display:grid;place-items:center;background:#232823;z-index:3}strong{letter-spacing:1px;font-size:10px}</style></head><body><div id="loading">Loading the exported GLB…</div><header><strong>EXPORTED GLB / DETAIL V4</strong><select id="view" aria-label="Branding location"><option value="0">Entrance walls</option><option value="1">Discovery Lab</option><option value="2">Arena stage</option><option value="3">Partner suite</option><option value="4">Imprint showcase</option><option value="5">Workshop</option><option value="6">Studio</option><option value="7">Team Base</option><option value="8">Arena back tier</option><option value="9">Fuel & Recovery</option></select><a href="./?view=entrance&rev=detail-v4">WebXR walkthrough ↗</a><a href="world.glb?rev=detail-v4" download="Creator-Base-Detail-v4.glb">Download GLB ↓</a></header><div id="status">Checking embedded branding…</div><script type="module">
import * as T from 'three';import {GLTFLoader} from './vendor/GLTFLoader.js';import {HDRLoader} from './vendor/HDRLoader.js';
const renderer=new T.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=.9;document.body.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#b5b0b8');const camera=new T.PerspectiveCamera(80,innerWidth/innerHeight,.07,1600);scene.add(new T.HemisphereLight('#ebe4f2','#6a5744',1.3));const sun=new T.DirectionalLight('#fff0da',2.5);sun.position.set(-50,60,30);scene.add(sun);
const views=[{p:[31.45,1.6,-33],t:[31.45,1.8,-39],fov:80},{p:[24,1.6,-39.2],t:[25.2,2.2,-35.5],fov:65},{p:[7.2,1.6,-31.5],t:[2.965,.156,-31.5],fov:65},{p:[49,1.6,-42.4],t:[45.87,2.7,-42.4],fov:65},{p:[6,1.6,-26.5],t:[6,1.7,-23.5],fov:70},{p:[14,1.6,-32.6],t:[17,1.6,-32.3],fov:70},{p:[14.6,1.6,-28.3],t:[15.2,1.6,-26.4],fov:65},{p:[46.4,1.6,-31],t:[51.4,1.6,-33.5],fov:65},{p:[11.55,2.7,-30.75],t:[1.65,.8,-31.5],fov:70},{p:[10,1.6,-39.2],t:[12.5,1,-36.4],fov:70}];function showView(i){const v=views[i];camera.position.set(...v.p);if(i===0&&innerWidth<600)camera.position.z=-30;camera.fov=v.fov;camera.lookAt(...v.t);camera.updateProjectionMatrix();}document.querySelector('#view').onchange=e=>showView(+e.target.value);
try{const env=await new HDRLoader().loadAsync('./assets/sunset.hdr');env.mapping=T.EquirectangularReflectionMapping;scene.environment=env;scene.environmentIntensity=.6;const gltf=await new GLTFLoader().loadAsync('./world.glb?rev=detail-v4');scene.add(gltf.scene);const marks=[];gltf.scene.traverse(o=>{if(o.userData.officialArtwork)marks.push(o);});if(marks.length!==5)throw new Error(`Expected five wordmarks; found ${marks.length}.`);showView(0);document.querySelector('#status').textContent=`Actual showcase GLB · ${marks.length} embedded wordmarks · interactions run in the WebXR app · drag to look`;document.querySelector('#loading').style.display='none';window.creatorBaseGLB={scene,model:gltf.scene,renderer,camera,marks,showView};renderer.setAnimationLoop(()=>renderer.render(scene,camera));}catch(error){document.querySelector('#loading').textContent='GLB check failed: '+error.message;console.error(error);}
let dragging=false,x=0,y=0;renderer.domElement.onpointerdown=e=>{dragging=true;x=e.clientX;y=e.clientY;e.target.setPointerCapture(e.pointerId);camera.rotation.reorder('YXZ');};renderer.domElement.onpointermove=e=>{if(!dragging)return;camera.rotation.y-=(e.clientX-x)*.003;camera.rotation.x=Math.max(-1.4,Math.min(1.4,camera.rotation.x-(e.clientY-y)*.003));x=e.clientX;y=e.clientY;};renderer.domElement.onpointerup=()=>dragging=false;renderer.domElement.onwheel=e=>{camera.fov=T.MathUtils.clamp(camera.fov+e.deltaY*.03,30,95);camera.updateProjectionMatrix();};addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script></body></html>
